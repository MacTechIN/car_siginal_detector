# ByteTrack tuned for a low, uneven frame rate (ESP32-CAM over Wi-Fi, ~3-10 fps):
# objects move further between frames, so association is looser and lost tracks live longer.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 20
match_thresh: 0.9
fuse_score: True
