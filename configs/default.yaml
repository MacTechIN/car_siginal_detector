# car_siginal_detector settings. Override with: python -m csd --config my.yaml
camera:
  # ESP32-CAM running CameraWebServer (esp32_cam/firmware/camera_web_server).
  # Tried first; then the camera's own AP (192.168.4.1, Wi-Fi "CSD-CAM"), esp32cam.local,
  # and a scan of the laptop's subnet (see csd/discover.py). stream = <base>:81/stream
  base_url: http://192.168.45.138
  # auto = USB cable first (board's native USB port; laptop Wi-Fi stays on the internet),
  # then Wi-Fi. usb / wifi force one of them.
  transport: auto
  auto_discover: true
  scan_subnet: true
  apply_settings: true
  # Sent to /control?var=..&val=.. at start-up. See research.md 5장 for the reasons.
  settings:
    framesize: XGA        # 1024x768. UXGA (1600x1200) crashed the camera on 2026-10-08 (q10): test before using
    quality: 12           # JPEG 0-63, lower = better (USB link tops out at ~650 KB/s)
    vflip: 1              # match how the board is mounted
    hmirror: 0
    awb: 1
    wb_mode: 1            # sunny: stable colours so red/yellow do not drift
    aec: 1
    ae_level: -1          # slightly darker: lit LED lamps keep their colour instead of white
    agc: 1
    gainceiling: 2
    saturation: 1

detector:
  model: models/yolo26s.pt   # yolo26n.pt = faster, yolo26m.pt = more accurate but slower
  imgsz: 640                 # 960-1280 helps far traffic lights at a CPU cost
  conf: 0.25
  device: cpu
  tracker: configs/tracker.yaml

traffic_light:
  classifier: models/tl_cls.pt   # used when present (tools/train_tl.py), else rule-based
  min_box_px: 6              # ignore heads smaller than this (short side)
  smooth_window_s: 1.0
  smooth_hold_s: 0.3

vehicle_lights:
  min_box_w_ratio: 0.12      # analyse lamps only on vehicles at least this wide (x frame width)

plate:
  enabled: true
  model_dir: models/plates
  every_s: 1.0               # OCR at most once per second on the lead vehicle
  min_box_w_ratio: 0.18
  min_votes: 2

lanes:
  horizon_ratio: 0.55        # image row (fraction of height) of the horizon/vanishing area
  default_bottom_width: 0.9  # fallback ego-lane width at the bottom (fraction of width)
  default_top_width: 0.12
  # Learned lane lines (TwinLiteNet, MIT): curves, paint colour, solid/dashed, bonnet line.
  # tools/fetch_models.py --lanes; classical lanes are used when the file is missing.
  model: models/twinlitenet.onnx
  model_input: [320, 192]    # network input (w, h); 640x360 is sharper but ~4x slower
  model_every_s: 0.5         # background thread, at most this often
  model_device: GPU          # OpenVINO: GPU = Intel iGPU (~10 ms), CPU as fallback (~200 ms)
  model_threads: 2
  model_max_age_s: 3.0       # use a result up to this old (lane paint moves slowly in the image)

risk:
  ttc_warn: 2.7              # s, pre-warning (Mobileye FCW "up to 2.7 s")
  ttc_danger: 2.0            # s, urgent (NHTSA NCAP FCW test minimum 2.0-2.4 s)

scene:
  announce_every_s: 20       # spoken surroundings summary at most this often

tts:
  enabled: true
  voice_hint: Korean         # SAPI voice description substring (Microsoft Heami)
  rate: 1
  cooldown_s: 8
  max_age_s: 2.5

voice_label:
  model: models/vosk-model-small-ko-0.22   # offline Korean speech recognition
  device: null               # microphone (sounddevice index or name); null = Windows default

gps:
  # Phone GPS over NMEA (the laptop has none). Android "Share GPS" as a TCP server (port
  # 50000) or iOS "GPS2IP" (11123); with USB tethering the phone is the default gateway.
  # Other sources: serial://COM8:9600 (Bluetooth), file://drive.nmea (replay).
  enabled: false
  source: tcp://gateway:50000

guidance:
  # Fixed enforcement cameras (공공데이터포털 전국무인교통단속카메라표준데이터), see
  # tools/fetch_cameras.py. Voice guidance only.
  cameras: data/speed_cameras.csv
  announce_m: 500            # "500미터 앞 과속 단속 카메라, 제한속도 .."
  near_m: 200                # "속도를 줄이세요" here if over the limit
  margin_kmh: 5              # over the limit by more than this = speeding

log_dir: logs
record_dir: recordings
show: false                  # OpenCV window with overlays
